name: Apply #17570 candidate fix

on:
  push:
    branches:
      - agent/fix-17570-export-default-class-constraint

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-17570-export-default-class-constraint
          fetch-depth: 0

      - name: Apply surgical fix and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ctor = Path('crates/tsz-checker/src/types/class_type/constructor.rs')
          s = ctor.read_text()

          anchor1 = '''        // Patch the rough construct-signature return type now that the rough\n        // instance type is available, then republish the partial constructor\n'''
          insert1 = '''        // `export default class Foo` has two symbols: the class declaration's\n        // synthetic `default` export symbol (`current_sym`) and the name symbol\n        // that type references inside the class resolve through (`class_name_sym`).\n        //\n        // Constructor-shape construction runs before the real instance type is\n        // built. While typing a function-valued property initializer, a generic\n        // constraint such as `<R extends Foo>` can therefore re-enter instance\n        // resolution through `class_name_sym` with no instance shape published\n        // yet. That falls through to a bare Lazy/constructor-side resolution and\n        // can make a nested constraint such as `MarkOf<R>` spuriously fail\n        // (`TS2344`, #17570).\n        //\n        // We already computed the declared-member rough instance above for this\n        // exact construction window. Publish it under the distinct class-name\n        // symbol until the real instance build completes, then restore the prior\n        // value. Plain/exported named classes have the same node/name symbol, so\n        // `class_name_sym` is None and their behavior is unchanged.\n        let previous_class_name_instance =\n            class_name_sym.and_then(|sym_id| self.ctx.symbol_instance_types.get(&sym_id));\n        let rough_class_name_instance = class_name_sym.and_then(|name_sym| {\n            (!rough_instance_return_type.is_any_unknown_or_error())\n                .then_some((name_sym, rough_instance_return_type))\n        });\n        if let Some((name_sym, rough_instance)) = rough_class_name_instance {\n            self.ctx\n                .symbol_instance_types\n                .insert(name_sym, rough_instance);\n        }\n\n'''
          if insert1 not in s:
              if anchor1 not in s:
                  raise SystemExit('constructor insertion anchor 1 not found')
              s = s.replace(anchor1, insert1 + anchor1, 1)

          anchor2 = '''        // Class constructor values always expose an implicit `prototype` property\n'''
          insert2 = '''        // End the export-default class-name publication window. If something\n        // produced a newer instance value while the window was open, preserve it;\n        // otherwise restore exactly what was present before the constructor build.\n        if let Some((name_sym, rough_instance)) = rough_class_name_instance\n            && self.ctx.symbol_instance_types.get(&name_sym) == Some(rough_instance)\n        {\n            if let Some(previous) = previous_class_name_instance {\n                self.ctx.symbol_instance_types.insert(name_sym, previous);\n            } else {\n                self.ctx.symbol_instance_types.remove(&name_sym);\n            }\n        }\n\n'''
          if insert2 not in s:
              if anchor2 not in s:
                  raise SystemExit('constructor insertion anchor 2 not found')
              s = s.replace(anchor2, insert2 + anchor2, 1)
          ctor.write_text(s)

          tests = Path('crates/tsz-cli/src/driver/check_tests/check_tests_part4.rs')
          t = tests.read_text()
          test_block = r'''    #[test]
    fn export_default_class_function_property_constraints_see_instance_members() {
        let options = resolved_options_for_es2015_strict_test();
        let base = std::path::Path::new("/");
        let diagnostics = collect_test_diagnostics_with_options(
            &[(
                "/export-default-function-properties.ts",
                r#"
type MarkOf<R extends { readonly mark: unknown }> = R["mark"];
export default class Schema<T = any> {
  readonly mark!: T;

  static make = <R extends Schema>(
    build: (x: number) => MarkOf<R>,
  ): R => null as any;

  take = <R extends Schema>(
    build: (x: number) => MarkOf<R>,
  ): R => null as any;

  static makeFunction = function<R extends Schema>(
    build: (x: number) => MarkOf<R>,
  ): R {
    return null as any;
  };
}
"#,
            )],
            &options,
            base,
        );

        assert!(
            diagnostics.is_empty(),
            "export-default class name references inside function-valued property \\
             signatures must see the class instance shape; got: {diagnostics:#?}"
        );
    }

'''
          test_anchor = '''    // ------------------------------------------------------------------\n    // Deeply-nested homomorphic mapped-type reducer relation\n'''
          if test_block not in t:
              if test_anchor not in t:
                  raise SystemExit('test insertion anchor not found')
              t = t.replace(test_anchor, test_block + test_anchor, 1)
          tests.write_text(t)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Run targeted regression test
        run: cargo test -p tsz-cli export_default_class_function_property_constraints_see_instance_members -- --nocapture

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/apply-17570-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tsz-checker/src/types/class_type/constructor.rs crates/tsz-cli/src/driver/check_tests/check_tests_part4.rs .github/workflows/apply-17570-fix.yml
          git commit -m "fix export default class constraint resolution"
          git push origin HEAD:agent/fix-17570-export-default-class-constraint
